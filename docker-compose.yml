# Local stand-ins for the Alibaba services. `docker compose up` boots Postgres
# (=> RDS), MinIO (=> OSS), and the ffmpeg worker. The same backend code runs
# against these locally and against Alibaba in prod by swapping .env.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: recut
      POSTGRES_PASSWORD: recut
      POSTGRES_DB: recut
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recut"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Creates the bucket on first boot.
  minio-init:
    image: minio/mc:latest
    depends_on: { minio: { condition: service_healthy } }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/recut &&
      mc anonymous set download local/recut || true
      "

  api:
    build: { context: ., dockerfile: infra/Dockerfile.backend }
    command: recut-api
    env_file: [.env]
    environment:
      RECUT_DATABASE_URL: postgresql+psycopg://recut:recut@postgres:5432/recut
      RECUT_S3_ENDPOINT: http://minio:9000
      RECUT_S3_PUBLIC_BASE: http://localhost:9000/recut
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }

  worker:
    build: { context: ., dockerfile: infra/Dockerfile.backend }
    command: recut-worker
    env_file: [.env]
    environment:
      RECUT_DATABASE_URL: postgresql+psycopg://recut:recut@postgres:5432/recut
      RECUT_S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }

volumes:
  pgdata:
  miniodata:
