const FONTS = { display: "Bricolage Grotesque", clean: "DM Sans", mono: "JetBrains Mono" };

  { id: 1, beat: "Hook",   type: "text",  text: "I saved 60% on marble. Here's how.", dur: 3, filled: false, style: { font: "display", size: "l", align: "center" } },

  { id: 3, beat: "Cut 1",  type: "roll",  text: "Walking onto the Foshan factory floor", dur: 3, filled: false, style: { font: "clean", size: "m", align: "left" } },
  { id: 4, beat: "Cut 2",  type: "broll", text: "Slabs on the saw line — sparks, the scale of the warehouse", dur: 3, filled: false, style: { font: "clean", size: "m", align: "left" } },

const INIT_PROJECTS = [
  { id: "p1", name: "Marble sourcing reel", edited: "just now",   stage: 2, tone: "#FF5C49" },
  { id: "p2", name: "5 renovation mistakes", edited: "yesterday", stage: 4, tone: "#7B5CFF" },
  { id: "p3", name: "Custom carpentry BTS",  edited: "3 days ago", stage: 5, tone: "#0FB5A6" },
];
const STAGES = ["Reference", "Recipe", "Script", "Storyboard", "Cover"];

function App() {
  const [view, setView] = useState("projects"); // projects | editor
  const [projects, setProjects] = useState(INIT_PROJECTS);
  const [activeId, setActiveId] = useState(null);

  const open = (id) => { setActiveId(id); setView("editor"); };
  const active = projects.find((p) => p.id === activeId);

  return (
    <div className="rc-root">
      <style>{css}</style>
      {view === "projects" ? (
        <Projects projects={projects} setProjects={setProjects} open={open} />
      ) : (
        <Editor key={activeId} project={active} exit={() => setView("projects")} />
      )}
    </div>
  );
}

/* ------------------------------- Projects ------------------------------- */
function Projects({ projects, setProjects, open }) {
  const [menu, setMenu] = useState(null);
  const [renaming, setRenaming] = useState(null);
  const [confirmDel, setConfirmDel] = useState(null);

  const create = () => {
    const id = "p" + Date.now();
    setProjects([{ id, name: "Untitled project", edited: "just now", stage: 0, tone: "#5B3DF5" }, ...projects]);
    open(id);
  };
  const dup = (p) => {
    setProjects((ps) => [{ ...p, id: "p" + Date.now(), name: p.name + " copy", edited: "just now" }, ...ps]);
    setMenu(null);
  };
  const del = (id) => { setProjects((ps) => ps.filter((p) => p.id !== id)); setConfirmDel(null); setMenu(null); };
  const rename = (id, name) => { setProjects((ps) => ps.map((p) => p.id === id ? { ...p, name: name || "Untitled project" } : p)); setRenaming(null); };

  return (
    <div className="rc-proj-page">
      <header className="rc-top">
        <div className="rc-brand">
          <span className="rc-mark"><Clapperboard size={15} strokeWidth={2.4} /></span>
          <span className="rc-name">Recut</span>
        </div>
        <span className="rc-acct">jellyfuur</span>
      </header>

      <div className="rc-proj-inner">
        <div className="rc-proj-head">
          <div>
            <h1>Projects</h1>
            <p>Every post starts from a format you love. Pick up where you left off, or start a new one.</p>
          </div>
        </div>

        <div className="rc-grid">
          <button className="rc-newtile" onClick={create}>
            <span className="rc-newplus"><Plus size={22} /></span>
            <span>New project</span>
          </button>

          {projects.map((p) => (
            <div className="rc-card" key={p.id}>
              <button className="rc-cardthumb" style={{ background: `linear-gradient(155deg, ${p.tone}, ${shade(p.tone)})` }} onClick={() => open(p.id)}>
                <span className="rc-cardstage">{STAGES[p.stage] || "Draft"}</span>
                <span className="rc-cardplay"><Play size={16} fill="#fff" strokeWidth={0} /></span>
              </button>
              <div className="rc-cardrow">
                <div className="rc-cardinfo">
                  {renaming === p.id ? (
                    <input autoFocus className="rc-renameinput" defaultValue={p.name}
                      onBlur={(e) => rename(p.id, e.target.value.trim())}
                      onKeyDown={(e) => e.key === "Enter" && rename(p.id, e.target.value.trim())} />
                  ) : (
                    <span className="rc-cardname" onClick={() => open(p.id)}>{p.name}</span>
                  )}
                  <span className="rc-cardedited">Edited {p.edited}</span>
                </div>
                <div className="rc-cardmenu">
                  <button className="rc-iconbtn" onClick={() => { setMenu(menu === p.id ? null : p.id); setConfirmDel(null); }}>
                    <MoreHorizontal size={17} />
                  </button>
                  {menu === p.id && (
                    <div className="rc-menu">
                      <button onClick={() => { setRenaming(p.id); setMenu(null); }}><Pencil size={13} /> Rename</button>
                      <button onClick={() => dup(p)}><Copy size={13} /> Duplicate</button>
                      {confirmDel === p.id
                        ? <button className="rc-del" onClick={() => del(p.id)}><Trash2 size={13} /> Delete for good?</button>
                        : <button className="rc-del" onClick={() => setConfirmDel(p.id)}><Trash2 size={13} /> Delete</button>}
                    </div>
                  )}
                </div>
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* -------------------------------- Editor -------------------------------- */
function Editor({ project, exit }) {
  const [stage, setStage] = useState(0);
  const [slots, setSlots] = useState(seedSlots());
  const [drafted, setDrafted] = useState(false);
  const [generated, setGenerated] = useState(false);
  const [generating, setGenerating] = useState(false);

  const go = (n) => setStage(n);
  const generate = () => {
    setGenerating(true);
    setTimeout(() => { setGenerating(false); setGenerated(true); setStage(3); }, 1700);
  };

  return (
    <>
      <header className="rc-top">
        <div className="rc-brand">
          <button className="rc-exit" onClick={exit}><ArrowLeft size={16} /></button>
          <span className="rc-mark"><Clapperboard size={15} strokeWidth={2.4} /></span>
          <span className="rc-name">Recut</span>
          <span className="rc-proj">/ {project?.name || "Untitled"}</span>
        </div>
        <div className="rc-meta">
          <span className="rc-ratio">9:16</span>
          <span className="rc-dur">{slots.reduce((a, s) => a + s.dur, 0)}s</span>
        </div>
      </header>

      <div className="rc-bodywrap">
        <nav className="rc-rail" aria-label="Stages">
          {STAGES.map((s, i) => {
            const reachable = i <= stage || (i === 3 && generated);
            return (
              <button key={s} disabled={!reachable && i > stage}
                className={"rc-step" + (i === stage ? " is-active" : "") + (i < stage ? " is-done" : "")}
                onClick={() => reachable && go(i)}>
                <span className="rc-num">{i < stage ? <Check size={13} strokeWidth={3} /> : String(i + 1).padStart(2, "0")}</span>
                <span className="rc-steplabel">{s}</span>
              </button>
            );
          })}
          <div className="rc-railfoot">Borrow the format.<br />Tell your story.</div>
        </nav>

        <main className="rc-canvas" key={stage}>
          {stage === 0 && <Reference next={() => go(1)} />}
          {stage === 1 && <Recipe slots={slots} next={() => go(2)} back={() => go(0)} />}
          {stage === 2 && <Script slots={slots} drafted={drafted} setDrafted={setDrafted}
                                  generate={generate} back={() => go(1)} />}
          {stage === 3 && <Storyboard slots={slots} setSlots={setSlots} next={() => go(4)} back={() => go(2)} />}
          {stage === 4 && <Cover back={() => go(3)} />}
        </main>
      </div>

      {generating && (
        <div className="rc-overlay">
          <div className="rc-gencard">
            <div className="rc-genspin" />
            <h3>Building your base cut</h3>
            <p className="rc-genstep">Assigning slots · generating stand-ins · stitching the timeline</p>
          </div>
        </div>
      )}
    </>
  );
}

/* ----------------------------- 01 Reference ----------------------------- */
function Reference({ next }) {
  const [mode, setMode] = useState("upload"); // upload | link
  const [url, setUrl] = useState("");
  const [loaded, setLoaded] = useState(null);
  const [err, setErr] = useState("");

  const fetchLink = () => {
    const u = url.trim();
    if (!u) { setErr("Paste a reel or carousel link to continue."); return; }
    const platform = /tiktok/i.test(u) ? "TikTok" : "Instagram";
    setLoaded({ platform, url: u }); setErr("");
  };
  const ref = loaded
    ? { tag: loaded.platform.toUpperCase() + " · linked", cap: loaded.url }
    : { tag: "REEL · 0:23", cap: "@studio.haul — “Sourcing haul → big reveal”" };

  return (
    <div className="rc-stage">
      <Head k="01" t="Drop a post you love the format of" s="One reel or carousel. The agent learns its recipe — the beats, the pacing, the caption rhythm — never its content." />
      <div className="rc-refgrid">
        <div className="rc-refcard">
          <div className="rc-refphone">
            <div className="rc-refplay"><Play size={20} fill="#fff" strokeWidth={0} /></div>
            <div className="rc-reftag">{ref.tag}</div>
            <div className="rc-refcap">{ref.cap}</div>
          </div>
          <div className="rc-refmeta">
            {loaded
              ? <span className="rc-refstat">fetched from {loaded.platform}</span>
              : <><span className="rc-refstat">412k plays</span><span className="rc-refstat">7 cuts</span><span className="rc-refstat">fast-cut</span></>}
          </div>
        </div>
        <div className="rc-drop">
          {mode === "upload" ? (
            <div className="rc-dropinner">
              <Upload size={22} strokeWidth={2} />
              <p className="rc-dropmain">Drop a video or carousel</p>
              <p className="rc-dropsub">MP4, MOV or images — up to 200MB</p>
              <div className="rc-or"><span>or</span></div>
              <button className="rc-ghost" onClick={() => setMode("link")}><Link2 size={15} /> Paste a link</button>
            </div>
          ) : (
            <div className="rc-dropinner rc-linkmode">
              <Link2 size={22} strokeWidth={2} />
              <p className="rc-dropmain">Paste a reel or carousel link</p>
              <div className="rc-linkrow">
                <input value={url} autoFocus placeholder="https://instagram.com/reel/…"
                  onChange={(e) => { setUrl(e.target.value); setErr(""); }}
                  onKeyDown={(e) => e.key === "Enter" && fetchLink()} />
                <button className="rc-cta sm" onClick={fetchLink}>Fetch</button>
              </div>
              {err && <p className="rc-err">{err}</p>}
              {loaded && <p className="rc-linkok"><Check size={13} /> Pulled from {loaded.platform} — ready to analyse</p>}
              <button className="rc-ghost rc-uploadinstead" onClick={() => setMode("upload")}><Upload size={15} /> Upload instead</button>
            </div>
          )}
        </div>
      </div>
      <Foot right={<button className="rc-cta" onClick={next}>Analyse the format <ArrowRight size={16} /></button>}
            note={loaded ? "Reference pulled from your link." : "Demo reference loaded — analyse to see the recipe."} />
    </div>
  );
}

/* ------------------------------- 02 Recipe ------------------------------ */
function Recipe({ slots, next, back }) {
  let t = 0;
  const fmt = (sec) => "0:" + String(sec).padStart(2, "0");
  return (
    <div className="rc-stage">
      <Head k="02" t="Here's the recipe we pulled" s="The agent watched the reference — shot by shot, audio and on-screen text — and broke it into seven beats. This structure becomes your template." />
      <div className="rc-analysis">
        <span><b>0:23</b> analysed</span><i /><span><b>7</b> shots detected</span><i /><span>audio transcribed</span><i /><span>on-screen text read</span>
      </div>
      <div className="rc-recipe">
        <div className="rc-tl">
          {slots.map((s) => {
            const T = TYPES[s.type];
            const start = t; t += s.dur;
            return (
              <div className="rc-tlrow" key={s.id}>
                <span className="rc-tlts">{fmt(start)}</span>
                <span className="rc-tlbeat"><b>{s.beat}</b></span>
                <span className="rc-chip" style={{ background: T.soft, color: T.color }}><T.Icon size={13} /> {T.label}</span>
                <span className="rc-bar" style={{ width: 26 + s.dur * 14, background: T.color }} />
                <span className="rc-tldur">{s.dur}s</span>
              </div>
            );
          })}
        </div>
        <aside className="rc-readout">
          <h4>What the agent noticed</h4>
          <div className="rc-hooktrans"><span>Transcribed hook</span>“Wait till you see what this actually cost…”</div>
          <ul>
            <li><b>Hook-first.</b> A 3-second bold-text claim before anything else.</li>
            <li><b>Proof in the middle.</b> Three quick cuts carry the evidence.</li>
            <li><b>Payoff to camera.</b> The reveal lands on a talking head.</li>
            <li><b>Captions burned in,</b> punchy and lower-third.</li>
          </ul>
          <div className="rc-legend">{Object.values(TYPES).map((T) => (
            <span key={T.label} className="rc-legitem"><i style={{ background: T.color }} />{T.label}</span>))}
          </div>
        </aside>
      </div>
      <Foot left={<button className="rc-back" onClick={back}><ArrowLeft size={16} /> Reference</button>}
            right={<button className="rc-cta" onClick={next}>Use this structure <ArrowRight size={16} /></button>} />

}

/* ------------------------------- 03 Script ------------------------------ */
const THREAD = [
  { who: "agent", text: "Tell me everything about this post — what's the story, what surprised you, and what do you want people to feel by the end?" },
  { who: "you",   text: "I flew to Foshan and bought marble straight from the factory. Same slabs the showrooms sell, about 60% cheaper. I want people to feel like they've been overpaying." },
  { who: "agent", text: "Love it — that gap between showroom price and factory price is your whole hook. One thing: what's the single most striking visual from the trip?" },
  { who: "you",   text: "The warehouse scale. Slabs stacked three storeys high, saws throwing sparks." },
  { who: "agent", text: "Perfect. I'll open on the claim, use the warehouse for proof, and land the payoff to camera. Drafting it onto your seven beats now." },
];

function Script({ slots, drafted, setDrafted, generate, back }) {
  const [step, setStep] = useState(1);
  const visible = THREAD.slice(0, step);
  const done = step >= THREAD.length;

  return (
    <div className="rc-stage">
      <Head k="03" t="Your story, written into the recipe" s="Share as much as you can about your idea. The agent asks, you answer, it maps everything onto the beats — back and forth until it sounds like you." />
      <div className="rc-script">
        <div className="rc-scriptmain">
          {!drafted ? (
            <div className="rc-emptyscript">
              <Sparkles size={20} />
              <p>Your script appears here as you and the agent shape it.</p>
              {done && <button className="rc-cta rc-draftbtn" onClick={() => setDrafted(true)}><Pencil size={15} /> Draft the script</button>}
            </div>
          ) : (
            <div className="rc-beats">
              {slots.map((s) => {
                const T = TYPES[s.type];
                return (
                  <div className="rc-beatcard" key={s.id}>
                    <div className="rc-beathead">
                      <span className="rc-chip sm" style={{ background: T.soft, color: T.color }}><T.Icon size={12} /> {s.beat}</span>
                      <span className="rc-beatkind">{s.type === "text" ? "On-screen text" : "Voiceover"}</span>
                    </div>
                    <p className="rc-beatline">{s.text}</p>
                    <button className="rc-refine"><RefreshCw size={12} /> Refine</button>
                  </div>
                );
              })}
            </div>
          )}
        </div>

        <aside className="rc-chat">
          <div className="rc-chathead"><Sparkles size={14} /> Co-writing</div>
          <div className="rc-thread">
            {visible.map((m, i) => <div key={i} className={"rc-msg " + m.who}>{m.text}</div>)}
          </div>
          <div className="rc-chatbar">
            <input placeholder={done ? "Tweak any line…" : "Reply to the agent…"} />
            <button onClick={() => setStep((s) => Math.min(THREAD.length, s + 1))}>
              {done ? <CornerDownLeft size={15} /> : <ArrowRight size={15} />}
            </button>
          </div>
        </aside>
      </div>
      <Foot left={<button className="rc-back" onClick={back}><ArrowLeft size={16} /> Recipe</button>}
            right={<button className="rc-cta" disabled={!drafted} onClick={generate}>Generate base cut <ArrowRight size={16} /></button>}
            note={drafted ? "On your go-ahead — slots get assigned and the cut is built." : null} />
    </div>
  );
}

/* ----------------------------- 04 Storyboard ---------------------------- */
const SIZE = { s: 13, m: 16, l: 24 };
function Storyboard({ slots, setSlots, next, back }) {
  const [active, setActive] = useState(slots[0]?.id);
  const [swapFor, setSwapFor] = useState(null);
  const [ovFor, setOvFor] = useState(null);
  const [styleFor, setStyleFor] = useState(null);
  const [adding, setAdding] = useState(false);
  const [prompting, setPrompting] = useState(false);

  const activeSlot = slots.find((s) => s.id === active) || slots[0];
  const need = slots.filter((s) => TYPES[s.type].actor === "you" && !s.filled);

  const patch = (id, fn) => setSlots((ps) => ps.map((s) => s.id === id ? fn(s) : s));
  const swap = (id, action) => {
    patch(id, (s) =>
      action === "face" ? { ...s, type: "face", filled: true } :
      action === "broll" ? { ...s, type: "broll", filled: true } :
      action === "keep" ? { ...s, filled: false } : { ...s, filled: true });
    setSwapFor(null);
  };
  const setStyle = (id, key, val) => patch(id, (s) => ({ ...s, style: { ...s.style, [key]: val } }));
  const remove = (id) => { setSlots((ps) => ps.filter((s) => s.id !== id)); setOvFor(null); };
  const duplicate = (slot) => {
    setSlots((ps) => {
      const i = ps.findIndex((s) => s.id === slot.id);
      const copy = { ...slot, id: Date.now() };
      return [...ps.slice(0, i + 1), copy, ...ps.slice(i + 1)];
    });
    setOvFor(null);
  };
  const addSlot = (type, text) => {
    setSlots((ps) => [...ps, {
      id: Date.now(), beat: "New", type, dur: 3,
      filled: false, text: text || (type === "text" ? "New text card" : "Describe this shot"),
      style: { font: type === "text" ? "display" : "clean", size: "m", align: type === "text" ? "center" : "left" },
    }]);
    setAdding(false); setPrompting(false);
  };

  return (
    <div className="rc-stage">
      <Head k="04" t="Your base cut — swap, restyle, add" s="Every slot has a stand-in, so it plays end to end now. Replace what's yours, change the type or font, or add new slots — manually or by asking the agent." />
      <div className="rc-sbgrid">
        <div className="rc-slots">
          <div className="rc-checklist">
            <ListChecks size={15} />
            {need.length ? <span><b>{need.length} slots</b> need you — film {need.filter(s=>s.type==="talk").length}, pick {need.filter(s=>s.type==="roll").length}</span>
                         : <span>All yours. Nothing left to swap.</span>}
          </div>

          {slots.map((s) => {
            const T = TYPES[s.type];
            const isYou = TYPES[s.type].actor === "you";
            return (
              <div key={s.id} className={"rc-slot" + (active === s.id ? " is-active" : "")}>
                <button className="rc-slotmain" onClick={() => setActive(s.id)}>
                  <span className="rc-slotrail" style={{ background: T.color }} />
                  <span className="rc-slotbody">
                    <span className="rc-slottop">
                      <span className="rc-chip sm" style={{ background: T.soft, color: T.color }}><T.Icon size={12} /> {T.label}</span>
                      <span className="rc-slotdur">{s.dur}s</span>
                    </span>
                    <span className="rc-slottext">{s.type === "text" ? `“${s.text}”` : s.text}</span>
                  </span>
                </button>
                <div className="rc-slotside">
                  {s.filled ? <span className="rc-yours"><CheckCircle2 size={14} /> Yours</span>
                    : isYou ? <button className="rc-swap" onClick={() => { setSwapFor(swapFor === s.id ? null : s.id); setOvFor(null); setStyleFor(null); }}>{T.hint}</button>
                    : <span className="rc-auto">{T.hint}</span>}
                  <button className="rc-iconbtn sm" onClick={() => { setOvFor(ovFor === s.id ? null : s.id); setSwapFor(null); setStyleFor(null); }}><MoreHorizontal size={16} /></button>

                  {swapFor === s.id && (
                    <div className="rc-menu">
                      {s.type === "talk" && <>
                        <button onClick={() => swap(s.id, "film")}><Film size={13} /> Film with teleprompter <em className="rc-rec">best</em></button>
                        <button onClick={() => swap(s.id, "upload")}><Upload size={13} /> Upload a take</button>
                        <button onClick={() => swap(s.id, "face")}><UserRound size={13} /> Generate me from a photo</button></>}
                      {s.type === "roll" && <>
                        <button onClick={() => swap(s.id, "upload")}><Upload size={13} /> Upload a clip</button>
                        <button onClick={() => swap(s.id, "broll")}><Sparkles size={13} /> Use generated b-roll</button></>}
                      <button className="rc-menukeep" onClick={() => swap(s.id, "keep")}>Keep stand-in</button>
                    </div>
                  )}
                  {ovFor === s.id && (
                    <div className="rc-menu">
                      <button onClick={() => { setStyleFor(s.id); setOvFor(null); }}><Type size={13} /> Edit text & font</button>
                      <button onClick={() => duplicate(s)}><Copy size={13} /> Duplicate slot</button>
                      <button className="rc-del" onClick={() => remove(s.id)}><Trash2 size={13} /> Delete slot</button>
                    </div>
                  )}
                  {styleFor === s.id && (
                    <div className="rc-stylepop">
                      <div className="rc-styrow"><span>Font</span>
                        <div className="rc-seg3">{Object.keys(FONTS).map((f) => (
                          <button key={f} className={s.style.font === f ? "on" : ""} onClick={() => setStyle(s.id, "font", f)}
                            style={{ fontFamily: FONTS[f] }}>{f === "display" ? "Display" : f === "clean" ? "Clean" : "Mono"}</button>))}</div>
                      </div>
                      <div className="rc-styrow"><span>Size</span>
                        <div className="rc-seg3">{["s","m","l"].map((z) => (
                          <button key={z} className={s.style.size === z ? "on" : ""} onClick={() => setStyle(s.id, "size", z)}>{z.toUpperCase()}</button>))}</div>
                      </div>
                      <div className="rc-styrow"><span>Align</span>
                        <div className="rc-seg3">
                          <button className={s.style.align === "left" ? "on" : ""} onClick={() => setStyle(s.id, "align", "left")}><AlignLeft size={13} /></button>
                          <button className={s.style.align === "center" ? "on" : ""} onClick={() => setStyle(s.id, "align", "center")}><AlignCenter size={13} /></button>
                          <button className={s.style.align === "right" ? "on" : ""} onClick={() => setStyle(s.id, "align", "right")}><AlignRight size={13} /></button>
                        </div>
                      </div>
                      <button className="rc-styclose" onClick={() => setStyleFor(null)}><Check size={13} /> Done</button>
                    </div>
                  )}
                </div>
              </div>
            );
          })}

          {/* add slot */}
          <div className="rc-addwrap">
            {!adding ? (
              <button className="rc-add" onClick={() => setAdding(true)}><Plus size={15} /> Add slot</button>
            ) : prompting ? (
              <div className="rc-promptbox">
                <input autoFocus placeholder="Describe the shot — e.g. ‘aerial of the harbour at dusk’"
                  onKeyDown={(e) => e.key === "Enter" && addSlot("broll", e.target.value)} />
                <button className="rc-cta sm" onClick={(e) => addSlot("broll", e.currentTarget.previousSibling.value)}>Add</button>
                <button className="rc-iconbtn sm" onClick={() => { setAdding(false); setPrompting(false); }}><X size={15} /></button>
              </div>
            ) : (
              <div className="rc-addmenu">
                <span className="rc-addlabel">Add manually</span>
                {Object.entries(TYPES).map(([k, T]) => (
                  <button key={k} onClick={() => addSlot(k)} style={{ color: T.color }}><T.Icon size={13} /> {T.label}</button>))}
                <span className="rc-addlabel">Or</span>
                <button className="rc-addprompt" onClick={() => setPrompting(true)}><Sparkles size={13} /> Describe it for the agent</button>
              </div>
            )}
          </div>
        </div>

        {/* preview */}
        <aside className="rc-preview">
          <div className="rc-phone">
            <div className="rc-screen" style={{ background: `linear-gradient(150deg, ${TYPES[activeSlot.type].color}, ${shade(TYPES[activeSlot.type].color)})` }}>
              <div className="rc-screenbadge">{React.createElement(TYPES[activeSlot.type].Icon, { size: 13 })} {TYPES[activeSlot.type].label}</div>
              {activeSlot.type === "text"
                ? <div className="rc-screentext" style={{ fontFamily: FONTS[activeSlot.style.font], fontSize: SIZE[activeSlot.style.size] + 4, textAlign: activeSlot.style.align }}>{activeSlot.text}</div>
                : <>
                    <div className="rc-screenghost">{activeSlot.filled ? "your footage" : "stand-in"}</div>
                    <div className="rc-caption" style={{ fontFamily: FONTS[activeSlot.style.font], fontSize: SIZE[activeSlot.style.size], textAlign: activeSlot.style.align }}>{activeSlot.text}</div>
                  </>}
            </div>
            <div className="rc-timeline">
              {slots.map((s) => (
                <button key={s.id} title={s.beat}
                  className={"rc-seg" + (active === s.id ? " is-active" : "")}
                  style={{ flex: s.dur, background: TYPES[s.type].color, opacity: s.filled ? 1 : 0.45 }}
                  onClick={() => setActive(s.id)} />))}
            </div>
          </div>
          <div className="rc-previewfoot"><Play size={13} fill="currentColor" strokeWidth={0} /> Plays now · edits apply live</div>
          <div className="rc-audio">
            <div className="rc-audiohead"><Volume2 size={14} /> Audio</div>
            <button className="rc-audiorow"><Mic size={13} /> Voiceover <span>Your voice</span></button>
            <button className="rc-audiorow"><Music size={13} /> Sound <span>Trending · upbeat</span></button>
          </div>
        </aside>
      </div>
      <Foot left={<button className="rc-back" onClick={back}><ArrowLeft size={16} /> Script</button>}
            right={<button className="rc-cta" onClick={next}>Make the cover <ArrowRight size={16} /></button>} />
    </div>
  );
}

/* ------------------------------- 05 Cover ------------------------------- */
const COVERS = [
  { id: "claim", label: "Bold claim",     bg: "#17151C", fg: "#FFFFFF", accent: "#FF5C49", big: "60% OFF", small: "MARBLE, DIRECT FROM THE FACTORY" },
  { id: "face",  label: "Face + caption", bg: "#0FB5A6", fg: "#03251F", accent: "#03251F", big: "I went to\nthe source", small: "FOSHAN SOURCING TRIP" },
  { id: "split", label: "Before / after", bg: "#F5A524", fg: "#2A1B00", accent: "#2A1B00", big: "$$$ → $", small: "WHAT MIDDLEMEN DON'T TELL YOU" },
];
function Cover({ back }) {
  const [cover, setCover] = useState("claim");

  const tags = "#renovation #interiordesign #marble #sourcing #factorydirect #homereno #designtips";

    <div className="rc-stage">

      <div className="rc-covergrid">

          <div className="rc-coveropts">

            </div>

        </div>
        <aside className="rc-coverpreview">
          <div className="rc-phone">
            <div className="rc-screen" style={{ background: c.bg, justifyContent: "center", alignItems: "flex-start" }}>
              <div className="rc-coverbig" style={{ color: c.accent }}>{c.big}</div>
              <div className="rc-coversmall" style={{ color: c.fg }}>{c.small}</div>
            </div>
          </div>
          {exported ? <div className="rc-done"><CheckCircle2 size={16} /> Exported — reel, cover & caption ready.</div>
                    : <button className="rc-cta rc-export" onClick={() => setExported(true)}><Download size={16} /> Export reel + cover</button>}
        </aside>
      </div>
      <Foot left={<button className="rc-back" onClick={back}><ArrowLeft size={16} /> Storyboard</button>} />
    </div>
  );

/* ------------------------------- helpers -------------------------------- */
function Head({ k, t, s }) {
  return (<div className="rc-head"><span className="rc-kicker">{k}</span><h2>{t}</h2><p>{s}</p></div>);
}
function Foot({ left, right, note }) {
  return (<div className="rc-foot"><div className="rc-footl">{left}{note && <span className="rc-note">{note}</span>}</div><div className="rc-footr">{right}</div></div>);
}
function shade(hex) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.max(0, (n >> 16) - 46), g = Math.max(0, ((n >> 8) & 255) - 46), b = Math.max(0, (n & 255) - 46);
  return `rgb(${r},${g},${b})`;
}

.rc-step.is-active{background:var(--ink);color:#fff;}
.rc-step.is-active .rc-num{background:#fff;color:var(--ink);border-color:#fff;}
.rc-railfoot{margin-top:auto;font-family:var(--display);font-weight:600;font-size:15px;line-height:1.25;letter-spacing:-.01em;padding:11px;}

.rc-canvas{flex:1;overflow:auto;padding:30px 38px;animation:fade .35s ease;}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.rc-stage{max-width:920px;margin:0 auto;display:flex;flex-direction:column;min-height:100%;}
.rc-head{margin-bottom:26px;}
.rc-kicker{font-family:var(--mono);font-size:11px;color:var(--violet);letter-spacing:.08em;}
.rc-head h2{font-family:var(--display);font-weight:700;font-size:29px;letter-spacing:-.025em;line-height:1.1;margin:8px 0 9px;}
.rc-head p{color:var(--soft);font-size:15px;line-height:1.5;max-width:620px;}

.rc-foot{margin-top:auto;padding-top:26px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.rc-footl{display:flex;align-items:center;gap:14px;}
.rc-note{color:var(--soft);font-size:12.5px;}
.rc-cta{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;font-weight:600;font-size:14px;padding:12px 18px;border-radius:11px;transition:transform .12s,opacity .12s;}
.rc-cta:hover:not(:disabled){transform:translateY(-1px);}
.rc-cta:disabled{opacity:.35;cursor:not-allowed;}
.rc-cta.sm{padding:8px 12px;font-size:13px;}
.rc-back{display:inline-flex;align-items:center;gap:6px;color:var(--soft);font-weight:500;font-size:14px;}
.rc-back:hover{color:var(--ink);}

.rc-refgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.rc-refcard{background:var(--paper2);border:1px solid var(--line);border-radius:16px;padding:14px;}
.rc-refphone{position:relative;aspect-ratio:9/13;border-radius:12px;background:linear-gradient(160deg,#2a2730,#4a4550);overflow:hidden;display:flex;align-items:flex-end;}
.rc-refplay{position:absolute;inset:0;margin:auto;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;}
.rc-reftag{position:absolute;top:11px;left:11px;font-family:var(--mono);font-size:10px;color:#fff;background:rgba(0,0,0,.4);padding:3px 7px;border-radius:6px;}
.rc-refcap{position:relative;color:#fff;font-size:12.5px;padding:12px;background:linear-gradient(transparent,rgba(0,0,0,.55));width:100%;}
.rc-refmeta{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap;}
.rc-refstat{font-family:var(--mono);font-size:11px;color:var(--soft);border:1px solid var(--line);border-radius:7px;padding:4px 8px;}
.rc-drop{border:1.5px dashed var(--line);border-radius:16px;display:grid;place-items:center;background:var(--paper2);}
.rc-dropinner{text-align:center;color:var(--soft);padding:24px;}
.rc-dropmain{font-weight:600;color:var(--ink);font-size:15px;margin-top:12px;}
.rc-dropsub{font-size:12.5px;margin-top:4px;}
.rc-or{display:flex;align-items:center;gap:10px;margin:16px 30px;}
.rc-or::before,.rc-or::after{content:"";height:1px;background:var(--line);flex:1;}
.rc-or span{color:var(--soft);font-size:12px;}
.rc-ghost{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:9px;padding:8px 13px;font-size:13px;color:var(--ink);background:#fff;}
.rc-ghost em{font-family:var(--mono);font-style:normal;font-size:9px;color:var(--violet);background:#ECE9FE;padding:2px 5px;border-radius:5px;}
.rc-linkmode{width:100%;}
.rc-linkrow{display:flex;gap:8px;width:100%;margin-top:14px;}
.rc-linkrow input{flex:1;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13px;background:#fff;}
.rc-err{color:#d63a2f;font-size:12.5px;margin-top:10px;}
.rc-linkok{display:flex;align-items:center;gap:6px;justify-content:center;color:#0a8f73;font-size:12.5px;margin-top:10px;}
.rc-uploadinstead{margin-top:14px;}
.rc-rec{font-family:var(--mono);font-style:normal;font-size:8.5px;color:var(--violet);background:#ECE9FE;padding:2px 5px;border-radius:5px;margin-left:auto;}

.rc-recipe{display:grid;grid-template-columns:1.25fr 1fr;gap:24px;}
.rc-tl{background:var(--paper2);border:1px solid var(--line);border-radius:16px;padding:8px 16px;}
.rc-tlrow{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);}
.rc-tlrow:last-child{border-bottom:none;}
.rc-tlbeat{width:54px;font-size:13px;}
.rc-bar{height:8px;border-radius:5px;flex-shrink:0;}
.rc-tldur{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--soft);}
.rc-chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:5px 9px;border-radius:8px;white-space:nowrap;}
.rc-chip.sm{font-size:11px;padding:3px 7px;}
.rc-readout{background:var(--ink);color:#fff;border-radius:16px;padding:20px;}
.rc-readout h4{font-family:var(--display);font-weight:600;font-size:15px;margin-bottom:12px;}
.rc-readout ul{list-style:none;display:flex;flex-direction:column;gap:11px;}
.rc-readout li{font-size:13px;line-height:1.45;color:#d6d2de;}
.rc-readout li b{color:#fff;}
.rc-legend{display:flex;flex-wrap:wrap;gap:8px 13px;margin-top:18px;padding-top:16px;border-top:1px solid #322e3c;}
.rc-legitem{display:flex;align-items:center;gap:6px;font-size:11px;color:#b8b3c2;}
.rc-legitem i{width:9px;height:9px;border-radius:3px;}

.rc-script{display:grid;grid-template-columns:1.4fr 1fr;gap:22px;}
.rc-emptyscript{border:1.5px dashed var(--line);border-radius:14px;padding:40px 24px;text-align:center;color:var(--soft);display:flex;flex-direction:column;align-items:center;gap:12px;}
.rc-emptyscript p{font-size:14px;max-width:240px;}
.rc-beats{display:flex;flex-direction:column;gap:10px;}
.rc-beatcard{background:var(--paper2);border:1px solid var(--line);border-radius:12px;padding:13px 14px;position:relative;animation:fade .3s ease;}
.rc-beathead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.rc-beatkind{font-family:var(--mono);font-size:10px;color:var(--soft);}
.rc-beatline{font-size:14.5px;line-height:1.4;}
.rc-refine{position:absolute;top:11px;right:12px;display:none;align-items:center;gap:4px;font-size:11px;color:var(--violet);}
.rc-beatcard:hover .rc-refine{display:inline-flex;}
.rc-chat{background:var(--paper2);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;overflow:hidden;height:fit-content;max-height:600px;}
.rc-chathead{display:flex;align-items:center;gap:7px;padding:13px 15px;border-bottom:1px solid var(--line);font-weight:600;font-size:13px;}
.rc-thread{padding:15px;display:flex;flex-direction:column;gap:10px;overflow:auto;}
.rc-msg{font-size:13px;line-height:1.45;padding:10px 12px;border-radius:12px;max-width:92%;animation:fade .3s ease;}
.rc-msg.you{background:var(--ink);color:#fff;align-self:flex-end;border-bottom-right-radius:4px;}
.rc-msg.agent{background:var(--paper);color:var(--ink);align-self:flex-start;border-bottom-left-radius:4px;}
.rc-chatbar{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);}
.rc-chatbar input{flex:1;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:13px;background:#fff;}
.rc-chatbar button{width:38px;border-radius:9px;background:var(--ink);color:#fff;display:grid;place-items:center;flex-shrink:0;}

.rc-sbgrid{display:grid;grid-template-columns:1fr 300px;gap:24px;align-items:start;}
.rc-slots{display:flex;flex-direction:column;gap:9px;}
.rc-checklist{display:flex;align-items:center;gap:9px;background:#ECE9FE;color:#3a25c4;border-radius:11px;padding:11px 14px;font-size:13px;}
.rc-slot{display:flex;align-items:stretch;background:var(--paper2);border:1px solid var(--line);border-radius:13px;transition:border-color .15s;position:relative;}
.rc-slot.is-active{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink);}
.rc-slotmain{flex:1;display:flex;text-align:left;border-radius:13px 0 0 13px;min-width:0;}
.rc-slotrail{width:4px;flex-shrink:0;border-radius:13px 0 0 13px;}
.rc-slotbody{padding:12px 14px;display:flex;flex-direction:column;gap:7px;min-width:0;}
.rc-slottop{display:flex;align-items:center;gap:9px;}
.rc-slotdur{font-family:var(--mono);font-size:10.5px;color:var(--soft);}
.rc-slottext{font-size:13.5px;line-height:1.35;}
.rc-slotside{display:flex;align-items:center;gap:4px;padding:0 11px 0 6px;position:relative;}
.rc-swap{border:1px solid var(--ink);border-radius:8px;padding:7px 11px;font-size:12px;font-weight:600;white-space:nowrap;background:#fff;}
.rc-swap:hover{background:var(--ink);color:#fff;}
.rc-auto{font-size:11px;color:var(--soft);white-space:nowrap;font-family:var(--mono);}
.rc-yours{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:#0a8f73;white-space:nowrap;}
.rc-stylepop{position:absolute;top:calc(100% + 6px);right:0;z-index:20;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(20,15,30,.14);padding:12px;width:230px;display:flex;flex-direction:column;gap:10px;}
.rc-styrow{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.rc-styrow>span{font-size:12px;color:var(--soft);}
.rc-seg3{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
.rc-seg3 button{padding:6px 9px;font-size:11.5px;display:grid;place-items:center;border-right:1px solid var(--line);min-width:32px;}
.rc-seg3 button:last-child{border-right:none;}
.rc-seg3 button.on{background:var(--ink);color:#fff;}
.rc-styclose{display:flex;align-items:center;justify-content:center;gap:6px;background:var(--paper);border-radius:8px;padding:8px;font-size:12.5px;font-weight:600;margin-top:2px;}
.rc-addwrap{margin-top:2px;position:relative;}
.rc-add{display:flex;align-items:center;gap:7px;width:100%;justify-content:center;border:1.5px dashed var(--line);border-radius:11px;padding:11px;color:var(--soft);font-weight:500;font-size:13px;}
.rc-add:hover{border-color:var(--violet);color:var(--violet);}
.rc-addmenu{border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px;display:flex;flex-direction:column;gap:2px;box-shadow:0 10px 26px rgba(20,15,30,.1);}
.rc-addlabel{font-family:var(--mono);font-size:10px;color:var(--soft);letter-spacing:.06em;padding:6px 8px 2px;text-transform:uppercase;}
.rc-addmenu>button{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;font-size:13px;font-weight:500;}
.rc-addmenu>button:hover{background:var(--paper);}
.rc-addprompt{color:var(--violet)!important;}
.rc-promptbox{display:flex;gap:8px;align-items:center;}
.rc-promptbox input{flex:1;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13px;background:#fff;}

.rc-preview{position:sticky;top:0;}
.rc-phone{background:#0d0b12;border-radius:22px;padding:8px;box-shadow:0 18px 44px rgba(20,15,30,.22);}
.rc-screen{aspect-ratio:9/16;border-radius:16px;overflow:hidden;position:relative;display:flex;flex-direction:column;justify-content:flex-end;padding:16px;}
.rc-screenbadge{position:absolute;top:12px;left:12px;display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:#fff;background:rgba(0,0,0,.32);padding:5px 9px;border-radius:8px;}
.rc-screentext{color:#fff;font-weight:700;line-height:1.12;letter-spacing:-.02em;margin:auto;width:100%;}
.rc-screenghost{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:12px;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.1em;}
.rc-caption{position:relative;color:#fff;font-weight:600;line-height:1.3;text-shadow:0 1px 8px rgba(0,0,0,.5);width:100%;}
.rc-timeline{display:flex;gap:2px;margin-top:8px;height:10px;}
.rc-seg{border-radius:3px;transition:opacity .15s;}
.rc-seg.is-active{outline:2px solid #fff;outline-offset:1px;}
.rc-previewfoot{display:flex;align-items:center;gap:6px;justify-content:center;margin-top:13px;font-size:11.5px;color:var(--soft);}

.rc-covergrid{display:grid;grid-template-columns:1fr 280px;gap:28px;align-items:start;}
.rc-coveropts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
.rc-coveropt{display:flex;flex-direction:column;gap:9px;}
.rc-coverthumb{aspect-ratio:9/14;border-radius:12px;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:16px;border:2px solid transparent;transition:transform .12s;}
.rc-coveropt:hover .rc-coverthumb{transform:translateY(-2px);}
.rc-coveropt.is-active .rc-coverthumb{border-color:var(--ink);box-shadow:0 0 0 3px var(--paper),0 0 0 4px var(--ink);}
.rc-coverthumb b{font-family:var(--display);font-weight:800;font-size:20px;line-height:1.04;letter-spacing:-.02em;}
.rc-coverthumb i{font-family:var(--mono);font-style:normal;font-size:8.5px;letter-spacing:.08em;}
.rc-coverlabel{font-size:12.5px;color:var(--soft);text-align:center;}
.rc-coverpreview{position:sticky;top:0;}
.rc-coverbig{font-family:var(--display);font-weight:800;font-size:38px;line-height:1.02;letter-spacing:-.03em;white-space:pre-line;margin-bottom:14px;}
.rc-coversmall{font-family:var(--mono);font-size:11px;letter-spacing:.08em;}
.rc-export{width:100%;justify-content:center;margin-top:14px;}
.rc-done{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;color:#0a8f73;font-weight:600;font-size:14px;background:#E1F6F3;border-radius:11px;padding:13px;}
.rc-analysis{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-bottom:16px;font-family:var(--mono);font-size:12px;color:var(--soft);}
.rc-analysis b{color:var(--ink);}
.rc-analysis i{width:4px;height:4px;border-radius:50%;background:var(--line);display:inline-block;}
.rc-tlts{font-family:var(--mono);font-size:10.5px;color:var(--soft);width:30px;flex-shrink:0;}
.rc-hooktrans{background:rgba(255,255,255,.07);border-radius:10px;padding:11px 12px;margin-bottom:14px;font-size:13px;line-height:1.4;color:#fff;font-style:italic;}
.rc-hooktrans span{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:#b8b3c2;margin-bottom:4px;text-transform:uppercase;font-style:normal;}
.rc-audio{margin-top:14px;background:var(--paper2);border:1px solid var(--line);border-radius:13px;padding:12px;}
.rc-audiohead{display:flex;align-items:center;gap:7px;font-weight:600;font-size:12.5px;margin-bottom:9px;}
.rc-audiorow{display:flex;align-items:center;gap:8px;width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;font-size:12.5px;margin-bottom:7px;background:#fff;text-align:left;}
.rc-audiorow:last-child{margin-bottom:0;}
.rc-audiorow:hover{border-color:var(--ink);}
.rc-audiorow span{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--soft);}
.rc-coverleft{display:flex;flex-direction:column;gap:18px;}
.rc-captionbox{background:var(--paper2);border:1px solid var(--line);border-radius:14px;padding:15px;}
.rc-captionhead{display:flex;align-items:center;gap:7px;font-weight:600;font-size:13px;margin-bottom:10px;}
.rc-copy{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--violet);border:1px solid var(--line);border-radius:7px;padding:5px 9px;}
.rc-copy:hover{background:var(--paper);}
.rc-captiontext{font-size:13.5px;line-height:1.5;margin-bottom:9px;}
.rc-tags{font-size:12.5px;color:var(--violet);line-height:1.5;}

.rc-overlay{position:fixed;inset:0;background:rgba(23,21,28,.5);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:50;animation:fade .25s ease;}
.rc-gencard{background:var(--paper2);border-radius:18px;padding:34px 40px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.3);}
.rc-genspin{width:38px;height:38px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--ink);margin:0 auto 16px;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.rc-gencard h3{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:-.02em;}
.rc-genstep{color:var(--soft);font-size:13px;margin-top:6px;}

@media (max-width:860px){
  .rc-rail{width:60px;}.rc-steplabel,.rc-railfoot{display:none;}
  .rc-refgrid,.rc-recipe,.rc-script,.rc-sbgrid,.rc-covergrid{grid-template-columns:1fr;}
  .rc-canvas{padding:20px;}
}
@media (prefers-reduced-motion:reduce){.rc-root *{animation:none!important;transition:none!important;}}
`;


ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
